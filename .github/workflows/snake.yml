name: Generate snake animation

on:
  schedule: # twice a day
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake svgs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0d9488&color_dots=#ebedf0,#99f6e4,#5eead4,#14b8a6,#0d9488
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf

      - name: push svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
